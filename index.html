<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plantillario CGAD: plantillas de consulta, urgencias y protocolos quirúrgicos de Cirugía General y del Aparato Digestivo, listas para rellenar y copiar.">
<meta name="theme-color" content="#0d6b5e">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plantillario CGAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: master–detail. Phone = one pane at a time with bottom nav; ≥900px = list column + document pane. */
:root{
  --bg:#eef3f1; --surface:#ffffff; --sunk:#e3ebe8; --ink:#13201e; --muted:#566864; --line:#d3ddda;
  --accent:#0d6b5e; --accent-ink:#ffffff; --accent-soft:#d6ece7;
  --urg:#b3261e; --urg-soft:#f8dedb; --qx:#0d6b5e; --qx-soft:#d6ece7; --cex:#2f55a4; --cex-soft:#dde5f6; --com:#6a4c9c; --com-soft:#ebe3f6;
  --fld:#fff0b8; --fld-ink:#5a4300; --fld-empty:#f1ece0; --fav:#c48600; --danger:#b3261e;
  --shadow:0 1px 2px rgb(19 32 30 / .06), 0 8px 24px -12px rgb(19 32 30 / .18);
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1312; --surface:#141e1c; --sunk:#0f1817; --ink:#e4edea; --muted:#93a6a1; --line:#25332f;
  --accent:#53c2ae; --accent-ink:#03211c; --accent-soft:#163a34;
  --urg:#f08174; --urg-soft:#3b1d1a; --qx:#53c2ae; --qx-soft:#163a34; --cex:#8fabf0; --cex-soft:#1c2747; --com:#b9a2ec; --com-soft:#2a2140;
  --fld:#4a3c0c; --fld-ink:#ffe28f; --fld-empty:#232a24; --fav:#f2c14e; --danger:#f08174;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px -14px rgb(0 0 0 / .7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1312; --surface:#141e1c; --sunk:#0f1817; --ink:#e4edea; --muted:#93a6a1; --line:#25332f;
  --accent:#53c2ae; --accent-ink:#03211c; --accent-soft:#163a34;
  --urg:#f08174; --urg-soft:#3b1d1a; --qx:#53c2ae; --qx-soft:#163a34; --cex:#8fabf0; --cex-soft:#1c2747; --com:#b9a2ec; --com-soft:#2a2140;
  --fld:#4a3c0c; --fld-ink:#ffe28f; --fld-empty:#232a24; --fav:#f2c14e; --danger:#f08174;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 10px 28px -14px rgb(0 0 0 / .7); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.filled{fill:currentColor}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .in{display:flex;align-items:center;gap:12px;padding-block:10px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.top-actions{margin-left:auto;display:none;gap:8px}
@media (min-width:900px){.top-actions{display:flex}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:var(--surface)}
.btn.icon{width:44px;padding:0}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* app grid */
.app{display:grid;grid-template-columns:1fr;min-height:calc(100% - 57px)}
@media (min-width:900px){.app{grid-template-columns:minmax(330px,390px) minmax(0,1fr)}
  .list-pane{border-right:1px solid var(--line);height:calc(100vh - 57px);position:sticky;top:57px;overflow:auto}}
@media (max-width:899px){
  body[data-view="list"] .main-pane{display:none}
  body:not([data-view="list"]) .list-pane{display:none}
}
.list-pane,.main-pane{min-width:0}

/* list pane */
.list-in{padding-block:16px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:900px){.list-in{padding-bottom:24px}}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-height:48px;box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search .ico{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:1rem;padding:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip .n{font-family:var(--f-mono);font-weight:500;font-size:.75rem;opacity:.7}
.list-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--muted)}
.list-meta select{border:0;background:transparent;font-weight:700;color:var(--ink);padding:4px 0}
.group-label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 2px -4px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 0;overflow:hidden;position:relative}
.item:hover{border-color:var(--muted)}
.item[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.item .stripe{align-self:stretch;width:5px;margin:-12px 0;flex:none}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item-title{font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.item-meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.02em}
.item .favmark{color:var(--fav)}
.t-urgencias{--t:var(--urg);--ts:var(--urg-soft)}
.t-quirurgica{--t:var(--qx);--ts:var(--qx-soft)}
.t-consulta{--t:var(--cex);--ts:var(--cex-soft)}
.t-comun{--t:var(--com);--ts:var(--com-soft)}
.stripe,.dot{background:var(--t)}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.status.local i{background:var(--fav)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-display);font-size:1.15rem}
.skeleton{height:62px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--sunk),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}

/* bottom nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottomnav .in{display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.bottomnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:none;font-size:.72rem;font-weight:700;color:var(--muted)}
.bottomnav button[aria-current="true"]{color:var(--accent)}
.bottomnav .fab{position:relative}
.bottomnav .fab span.plus{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--accent);color:var(--accent-ink);margin-top:-22px;box-shadow:var(--shadow)}
@media (min-width:900px){.bottomnav{display:none}}
body:not([data-view="list"]) .bottomnav{display:none}

/* main pane */
.main-in{padding-block:16px 120px;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
@media (min-width:900px){.main-in{padding-block:28px 64px}}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;border:0;background:none;font-weight:700;color:var(--accent);padding:6px 0;min-height:40px}
@media (min-width:900px){.back{display:none}}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--ts,var(--sunk));color:var(--t,var(--muted))}
.tag.plain{background:var(--sunk);color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4.6vw,2.3rem);line-height:1.08;letter-spacing:-.025em;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:1.15rem;margin:0;letter-spacing:-.01em}
.doc-head{display:flex;flex-direction:column;gap:12px}
.doc-actions{display:flex;flex-wrap:wrap;gap:8px}
.doc-actions .fav[aria-pressed="true"]{color:var(--fav)}
.updated{font-size:.8rem;color:var(--muted)}

/* fill fields */
.fields{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.fields-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fields-head h2 small{font-family:var(--f-mono);font-weight:500;font-size:.75rem;color:var(--muted);margin-left:6px}
.progress{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.field-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:620px){.field-grid{grid-template-columns:1fr 1fr}.field-grid .wide{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label,.f > .lbl{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.01em}
.f .multi{font-weight:400;font-style:italic}
.inp{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 12px;font-size:1rem}
.inp:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:38px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:.9rem;text-align:left;line-height:1.25}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.hint{margin:0;font-size:.8rem;color:var(--muted)}

.optsteps{display:flex;flex-direction:column;gap:6px}
.optstep{display:flex;align-items:flex-start;gap:10px;text-align:left;min-height:44px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);background:var(--bg);font-size:.9rem;line-height:1.35;color:var(--muted)}
.optstep .ico{width:18px;height:18px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line);stroke:transparent;padding:1px;background:var(--surface)}
.optstep[aria-pressed="true"]{border-style:solid;border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.optstep[aria-pressed="true"] .ico{background:var(--accent);border-color:var(--accent);stroke:var(--accent-ink)}
.optstep span{min-width:0;overflow-wrap:anywhere}
.sheet-body .optseg{cursor:pointer;border-radius:4px}
.sheet-body .optseg.off{opacity:.42;text-decoration:line-through;text-decoration-color:var(--muted)}
.sheet-body .optseg.off mark{background:transparent;border:0}
.sheet-body .optseg.on{background:var(--accent-soft);box-shadow:-3px 0 0 var(--accent)}
.sheet-body .optseg:focus-visible{outline:2px solid var(--accent)}
.gapin{margin-top:2px}
/* the sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sheet-band{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:linear-gradient(90deg,var(--ts),transparent 70%)}
.sheet-band b{color:var(--t);font-weight:600}
.sheet-body{padding:18px 16px 22px;font-family:var(--f-mono);font-size:.9rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
@media (min-width:620px){.sheet-body{padding:24px 28px 28px}}
.sheet-body mark{background:var(--fld);color:var(--fld-ink);border-radius:4px;padding:1px 4px;cursor:pointer;font-weight:600;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sheet-body mark.empty{background:var(--fld-empty);color:var(--muted);font-weight:500;border:1px dashed var(--line)}
.copybar{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:8px;justify-content:flex-end}
.copybar .btn.primary{flex:1;max-width:340px;min-height:52px;font-size:1rem}
@media (min-width:900px){.copybar{justify-content:flex-start}}

.sheet-band{align-items:center}
.sheet-band > span{margin-left:auto}
.sheet-copy{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--f-body);font-size:.78rem;font-weight:700;letter-spacing:0;text-transform:none}
.sheet-copy .ico{width:16px;height:16px}
.sheet-copy:hover{border-color:var(--accent);color:var(--accent)}
.sheet.recs{--t:var(--cex);--ts:var(--cex-soft);border-color:color-mix(in srgb,var(--cex) 35%,var(--line))}
.sheet.recs .sheet-body{font-family:var(--f-body);font-size:.95rem;line-height:1.6}
.copybar{flex-wrap:wrap}
.copybar .btn.primary.alt{background:var(--cex);border-color:var(--cex);color:var(--surface)}
@media (max-width:620px){.copybar .btn.primary{min-width:0;flex:1 1 140px;font-size:.92rem;padding:0 12px;white-space:normal;line-height:1.2}}
textarea.recs-ta{min-height:28vh}
/* editor */
.form{display:flex;flex-direction:column;gap:16px}
.row2{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:620px){.row2{grid-template-columns:1fr 1fr}}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border-radius:9px;font-weight:700;font-size:.88rem;color:var(--muted);cursor:pointer;text-align:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + label{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible + label{outline:2px solid var(--accent)}
select.inp{appearance:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
.toolbar .btn{min-height:36px;padding:0 12px;font-size:.84rem}
textarea.body{min-height:46vh;font-family:var(--f-mono);font-size:.88rem;line-height:1.65;resize:vertical;padding:14px}
.syntax{font-size:.82rem;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0;line-height:1.55}
.syntax code{font-family:var(--f-mono);font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 4px;color:var(--ink)}
.detected{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.detected .tag{text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:.78rem;background:var(--fld);color:var(--fld-ink)}
.edbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.edbar .sp{flex:1}
.err{color:var(--danger);font-size:.85rem;font-weight:700}

/* import */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card p{margin:0;color:var(--muted);font-size:.92rem}
.imp-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
.imp-list div{display:flex;gap:8px;align-items:center;font-size:.88rem;padding:6px 8px;border-radius:8px;background:var(--bg)}
.imp-list div span{min-width:0;overflow-wrap:anywhere}
.filelabel{align-self:flex-start}
.filelabel input{position:absolute;opacity:0;width:1px;height:1px}
pre.sample{margin:0;font-family:var(--f-mono);font-size:.76rem;background:var(--sunk);border-radius:10px;padding:12px;overflow-x:auto;line-height:1.55;color:var(--ink)}

/* welcome (desktop empty main) */
.welcome{display:flex;flex-direction:column;gap:18px;padding-top:8vh}
.welcome p{color:var(--muted);max-width:60ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:640px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;border-top:4px solid var(--t)}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}

.notice{font-size:.8rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-weight:700;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="topbar">
  <div class="in gutter">
    <div class="brand"><b>Plantillario</b><span>CGAD · consulta · urgencias · quirófano</span></div>
    <div class="top-actions" id="topActions">
      <button class="btn ghost" data-action="import">IMPORT_ICO Importar</button>
      <button class="btn primary" data-action="new">NEW_ICO Nueva plantilla</button>
    </div>
  </div>
</header>

<div class="app">
  <aside class="list-pane" aria-label="Plantillas">
    <div class="list-in gutter">
      <label class="search"><span id="searchIco"></span><span class="sr">Buscar</span>
        <input id="q" type="search" placeholder="Buscar por nombre, etiqueta o texto" autocomplete="off"></label>
      <div class="chips" id="typeChips" role="group" aria-label="Tipo"></div>
      <div class="chips" id="secChips" role="group" aria-label="Sección"></div>
      <div class="list-meta"><span class="status" id="status"><i></i>Cargando…</span>
        <label>Orden <select id="sort"><option value="recent">Recientes</option><option value="used">Más usadas</option><option value="az">A–Z</option></select></label></div>
      <div id="items" class="items"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </aside>
  <main class="main-pane" id="main"><div class="main-in gutter"></div></main>
</div>

<nav class="bottomnav" aria-label="Navegación">
  <div class="in gutter">
    <button data-action="home" aria-current="true" id="navList"><span id="navListIco"></span>Plantillas</button>
    <button class="fab" data-action="new" id="navNew"><span class="plus" id="navNewIco"></span>Nueva</button>
    <button data-action="import" id="navImp"><span id="navImpIco"></span>Importar</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- constants ---------- */
const COL = 'plantillas';
const LS_KEY = 'plantillario.local.v1';
const TYPES = {
  urgencias:{label:'Urgencias', plural:'Urgencias', band:'Valoración de urgencias'},
  quirurgica:{label:'Quirúrgica', plural:'Quirúrgicas', band:'Hoja quirúrgica'},
  consulta:{label:'Consulta', plural:'Consulta', band:'Consulta externa'},
  comun:{label:'Campo común', plural:'Campos comunes', band:'Bloque reutilizable'}
};
const TYPE_ORDER = ['urgencias','quirurgica','consulta','comun'];
const SECTIONS = ['CCP','CEG','CHP','CEM','General'];
const SEC_NAMES = {CCP:'Colorrectal y Proctología',CEG:'Esofagogástrica, Bariátrica y Pared',CHP:'Hepatobiliopancreática',CEM:'Endocrina y Mama',General:'General / Urgencias'};
const I = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  star:'<path d="m12 3.6 2.6 5.3 5.8.9-4.2 4.1 1 5.8L12 17l-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  import:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',
  dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>'
};
const ico = (n, cls='') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* ---------- state ---------- */
const state = {
  items:new Map(), ready:false, mode:'pending', canWrite:true,
  view:'list', currentId:null, q:'', type:'all', section:'all', sort:'recent',
  values:{}, sig:''
};
let db = null, downloads = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const newId = () => 'p-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); } catch { return ''; } };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function mapType(v){ const n=norm(v); if(/^(urg|urgencia|urgencias)$/.test(n)) return 'urgencias'; if(/^(qx|quirurgica|quirurgico|quirofano|protocolo quirurgico|hoja quirurgica)$/.test(n)) return 'quirurgica'; if(/^(cex|consulta|consultas)$/.test(n)) return 'consulta'; if(/^(comun|campo comun|campos comunes|bloque|bloques)$/.test(n)) return 'comun'; return null; }
function mapSection(v){ const n=norm(v).toUpperCase(); const hit=SECTIONS.find(s=>s.toUpperCase()===n); return hit || (n ? 'General' : null); }

/* ---------- field parsing ---------- */
const TOKEN = /\{\{\s*([^{}:]+?)\s*(?::\s*([^{}]*?))?\s*\}\}/g;
const OPT = /\[\[([\s\S]*?)\]\]/g;
const GAP = /…|_{3,}/;
const hasGap = s => GAP.test(String(s||''));
function stripTokens(s){ return String(s).replace(TOKEN,(a,l)=>tokenLabel(l)).replace(/\s+/g,' ').replace(/^[-–•*]\s*/,'').trim(); }
function parseOptionals(body, prefix='opt:'){
  const out=[]; let m, i=0; OPT.lastIndex=0;
  while((m=OPT.exec(body||''))){ const l=stripTokens(m[1]); out.push({key:prefix+i, label:l.length>110?l.slice(0,108)+'…':l}); i++; }
  return out;
}
function parseFields(body){
  const out=[], seen=new Set(); let m; TOKEN.lastIndex=0;
  while((m=TOKEN.exec(body||''))){
    let label=m[1].trim(); let multi=false;
    if(label.endsWith('*')){ multi=true; label=label.slice(0,-1).trim(); }
    const key=norm(label); if(!key || seen.has(key)) continue; seen.add(key);
    const options = m[2] ? m[2].split('|').map(s=>s.trim()).filter(Boolean) : null;
    out.push({key,label,options:options&&options.length?options:null,multi,isDate:key==='fecha' || key.startsWith('fecha ')});
  }
  return out;
}
const RECS_HEAD = /^[ \t]*recomendaciones (?:al alta|terap[eé]uticas)[ \t]*:?[ \t]*$/im;
function splitRecs(text){
  const t=String(text||''); const m=t.match(RECS_HEAD);
  if(!m) return {body:t.replace(/\s+$/,''), recs:''};
  return {body:t.slice(0,m.index).replace(/\s+$/,''), recs:t.slice(m.index+m[0].length).replace(/^\s*\n/,'').replace(/\s+$/,'')};
}
const allText = o => (o.body||'') + '\n' + (o.recs||'');
function joinMulti(arr){ if(!arr||!arr.length) return ''; if(arr.length===1) return arr[0]; return arr.slice(0,-1).join(', ')+' y '+arr[arr.length-1]; }
function fillGap(f, s, vals){
  if(!f || !f.options || !hasGap(s)) return s;
  const x=vals && vals[f.key+'::x'];
  return s.replace(GAP, x && x.trim() ? x.trim() : '…');
}
function valueOf(f, vals){
  if(!f) return '';
  const v=vals ? vals[f.key] : null;
  if(v==null || v==='') return '';
  if(Array.isArray(v)) return joinMulti(v.map(x=>fillGap(f,x,vals)));
  if(f.isDate && /^\d{4}-\d{2}-\d{2}$/.test(v)){ const [y,mo,d]=v.split('-'); return `${d}/${mo}/${y}`; }
  return fillGap(f, String(v), vals);
}
function tokenLabel(raw){ let l=raw.trim(); if(l.endsWith('*')) l=l.slice(0,-1).trim(); return l; }
function fillText(body, vals, fields, prefix='opt:'){
  const fmap=Object.fromEntries(fields.map(f=>[f.key,f]));
  let i=0;
  let s=(body||'').replace(OPT,(a,inner)=>vals[prefix+(i++)] ? inner : '\u0000');
  s=s.replace(TOKEN,(all,lab)=>{ const l=tokenLabel(lab); const t=valueOf(fmap[norm(l)], vals); return t ? t : `[${l}]`; });
  s=s.split('\n').filter(line=>!/^[\s\u0000]*\u0000[\s\u0000]*$/.test(line)).join('\n').replace(/[ \t]*\u0000/g,'');
  return s.replace(/\n{3,}/g,'\n\n').replace(/^\n+|\s+$/g,'');
}
function tokensHTML(src, vals, fmap){
  let html='', last=0, m; TOKEN.lastIndex=0;
  while((m=TOKEN.exec(src))){
    html += esc(src.slice(last,m.index));
    const l=tokenLabel(m[1]), k=norm(l), t=valueOf(fmap[k], vals);
    html += t ? `<mark data-k="${esc(k)}" title="${esc(l)}">${esc(t)}</mark>` : `<mark class="empty" data-k="${esc(k)}">${esc(l)}</mark>`;
    last = TOKEN.lastIndex;
  }
  return html + esc(src.slice(last));
}
function previewHTML(body, vals, fields, prefix='opt:'){
  const fmap=Object.fromEntries(fields.map(f=>[f.key,f]));
  const src=body||''; let html='', last=0, m, i=0; OPT.lastIndex=0;
  while((m=OPT.exec(src))){
    html += tokensHTML(src.slice(last,m.index), vals, fmap);
    const k=prefix+(i++), on=!!vals[k];
    html += `<span class="optseg ${on?'on':'off'}" data-opt="${k}" role="button" tabindex="0" aria-pressed="${on}" title="${on?'Paso incluido · pulsa para quitarlo':'Paso opcional · pulsa para incluirlo'}">${tokensHTML(m[1], vals, fmap)}</span>`;
    last = m.index + m[0].length; OPT.lastIndex = last;
  }
  return html + tokensHTML(src.slice(last), vals, fmap);
}

/* ---------- storage ---------- */
function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); const arr=raw?JSON.parse(raw):[]; state.items=new Map(arr.map(o=>[o.id,o])); }catch{ state.items=new Map(); } }
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...state.items.values()])); }catch{ toast('No se pudo guardar en este navegador'); } }
function bodyOf(o){ const {id, ...rest}=o; return rest; }
function dbErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){ state.canWrite=false; applyWriteMode(); return 'No tienes permiso para modificar estas plantillas.'; }
  if(c==='quota_exceeded') return 'Se ha llenado el espacio de la base de datos. Borra plantillas antiguas.';
  if(c==='resource_exhausted') return 'Demasiadas operaciones seguidas. Espera unos segundos.';
  return 'No se pudo guardar. Comprueba la conexión e inténtalo de nuevo.';
}
async function saveItem(o){
  if(state.mode==='db'){ await db.collection(COL).doc(o.id).set(bodyOf(o)); state.items.set(o.id,o); }
  else { state.items.set(o.id,o); persistLocal(); }
}
async function patchItem(id, patch){
  const cur=state.items.get(id); if(!cur) return;
  const next={...cur,...patch};
  if(state.mode==='db'){ await db.collection(COL).doc(id).update(patch); }
  else { persistLocal(); }
  state.items.set(id,next);
}
async function deleteItem(id){
  if(state.mode==='db'){ await db.collection(COL).doc(id).delete(); }
  state.items.delete(id); if(state.mode!=='db') persistLocal();
}

/* ---------- list ---------- */
function filtered(){
  const q=norm(state.q);
  let arr=[...state.items.values()];
  if(state.type==='fav') arr=arr.filter(o=>o.fav);
  else if(state.type!=='all') arr=arr.filter(o=>o.type===state.type);
  if(state.section!=='all') arr=arr.filter(o=>o.section===state.section);
  if(q){ const words=q.split(/\s+/); arr=arr.filter(o=>{ const hay=norm([o.title,(o.tags||[]).join(' '),o.section,TYPES[o.type]?.label,o.body,o.recs].join(' ')); return words.every(w=>hay.includes(w)); }); }
  const by={
    recent:(a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')),
    used:(a,b)=>(b.uses||0)-(a.uses||0) || a.title.localeCompare(b.title,'es'),
    az:(a,b)=>a.title.localeCompare(b.title,'es')
  }[state.sort];
  return arr.sort(by);
}
function renderChips(){
  const all=[...state.items.values()];
  const cnt=t=>t==='all'?all.length:t==='fav'?all.filter(o=>o.fav).length:all.filter(o=>o.type===t).length;
  const tchips=[['all','Todas',''],['urgencias','Urgencias','t-urgencias'],['quirurgica','Quirúrgicas','t-quirurgica'],['consulta','Consulta','t-consulta'],['comun','Campos comunes','t-comun'],['fav','Favoritas','']].filter(([k])=>k==='all'||k==='fav'||k==='urgencias'||k==='quirurgica'||cnt(k)>0);
  $('#typeChips').innerHTML=tchips.map(([k,l,c])=>`<button class="chip ${c}" data-action="type" data-v="${k}" aria-pressed="${state.type===k}">${c?'<span class="dot"></span>':''}${k==='fav'?ico('star','filled'):''}${l} <span class="n">${cnt(k)}</span></button>`).join('');
  $('#secChips').innerHTML=[['all','Todas las secciones'],...SECTIONS.map(s=>[s,s])].map(([k,l])=>`<button class="chip" data-action="sec" data-v="${k}" aria-pressed="${state.section===k}" ${k!=='all'?`title="${esc(SEC_NAMES[k])}"`:''}>${esc(l)}</button>`).join('');
}
function itemHTML(o){
  const n=parseFields(allText(o)).length;
  return `<button class="item t-${esc(o.type)}" data-action="open" data-id="${esc(o.id)}" aria-current="${state.currentId===o.id && state.view!=='list'}">
    <span class="stripe"></span>
    <span class="item-main"><span class="item-title">${esc(o.title)}</span>
    <span class="item-meta">${esc(TYPES[o.type]?.label||'')} · ${esc(o.section||'General')} · ${n} campo${n===1?'':'s'}${o.uses?` · ${o.uses}× usada`:''}</span></span>
    ${o.fav?`<span class="favmark" aria-label="Favorita">${ico('star','filled')}</span>`:''}
  </button>`;
}
function renderList(){
  renderChips();
  const box=$('#items');
  if(!state.ready){ return; }
  if(!state.items.size){
    box.innerHTML=`<div class="empty"><b>Aún no hay plantillas</b><span>Crea la primera o pega las que ya usas en el importador.</span>
      ${state.canWrite?`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn primary" data-action="new">${ico('plus')}Nueva</button><button class="btn" data-action="import">${ico('import')}Importar</button></div>`:''}</div>`;
    return;
  }
  const arr=filtered();
  if(!arr.length){ box.innerHTML=`<div class="empty"><b>Sin resultados</b><span>Prueba con otra palabra o quita algún filtro.</span><button class="btn" data-action="clear-filters">Quitar filtros</button></div>`; return; }
  if(state.type==='all' && state.sort!=='used' && !state.q){
    const groups=TYPE_ORDER.map(t=>[t,arr.filter(o=>o.type===t)]).filter(g=>g[1].length);
    const favs=arr.filter(o=>o.fav);
    let html='';
    if(favs.length) html+=`<div class="group-label">Favoritas</div>`+favs.map(itemHTML).join('');
    html+=groups.map(([t,l])=>`<div class="group-label">${TYPES[t].plural} · ${l.length}</div>`+l.map(itemHTML).join('')).join('');
    box.innerHTML=html;
  } else box.innerHTML=arr.map(itemHTML).join('');
}
function renderStatus(){
  const s=$('#status');
  if(!state.ready){ s.className='status'; s.innerHTML='<i></i>Cargando…'; return; }
  const n=state.items.size;
  if(state.mode==='db'){ s.className='status'; s.innerHTML=`<i></i>${n} plantilla${n===1?'':'s'} · sincronizadas`; }
  else { s.className='status local'; s.innerHTML=`<i></i>${n} · solo en este navegador`; }
}

/* ---------- main views ---------- */
function setMain(html){ const m=$('#main .main-in'); m.innerHTML=html; }
function go(view, id=null, {scroll=true}={}){
  state.view=view; state.currentId=id;
  document.body.dataset.view=view;
  $('#navList').setAttribute('aria-current', view==='list');
  renderMain(); renderList();
  if(scroll) window.scrollTo({top:0});
}
function renderMain(){
  const v=state.view;
  if(v==='detail'){ const o=state.items.get(state.currentId); if(!o){ return renderWelcome(); } return renderDetail(o); }
  if(v==='edit') return renderEditor(state.currentId ? state.items.get(state.currentId) : null);
  if(v==='import') return renderImport();
  renderWelcome();
}
function renderWelcome(){
  const all=[...state.items.values()];
  const c=t=>all.filter(o=>o.type===t).length;
  setMain(`<div class="welcome">
    <h1>Tus plantillas, listas para rellenar y copiar.</h1>
    <p>Elige una plantilla de la lista, completa los campos marcados en amarillo y copia el texto final a la historia clínica. Los datos que escribas al rellenar no se guardan.</p>
    <div class="stats">
      <div class="stat t-urgencias"><b>${c('urgencias')}</b><span>Urgencias</span></div>
      <div class="stat t-quirurgica"><b>${c('quirurgica')}</b><span>Quirúrgicas</span></div>
      <div class="stat t-consulta"><b>${c('consulta')}</b><span>Consulta</span></div>
      <div class="stat t-comun"><b>${c('comun')}</b><span>Campos comunes</span></div>
    </div>
    ${syntaxHelp()}
  </div>`);
}
function syntaxHelp(){
  return `<p class="syntax"><b>Campos:</b> <code>{{Edad}}</code> crea un hueco de texto · <code>{{Abordaje: laparoscópico | abierto}}</code> crea opciones · <code>{{Hallazgos*: a | b | c}}</code> permite elegir varias · <code>{{Fiebre: Afebril | Fiebre de … ºC}}</code> abre un hueco al elegir la opción con «…» · <code>{{Fecha}}</code> abre un calendario · <code>[[- Drenaje de Penrose…]]</code> es un paso opcional que solo se copia si lo marcas. Si repites el mismo nombre de campo, se rellena una sola vez.</p>`;
}
function detailSig(o){ return [o.id,o.title,o.type,o.section,(o.tags||[]).join(','),o.body,o.recs,o.fav,o.updatedAt].join('|'); }
function renderDetail(o){
  state.sig=detailSig(o);
  const fields=parseFields(allText(o));
  const opts=parseOptionals(o.body), ropts=parseOptionals(o.recs,'ropt:');
  const hasRecs=!!(o.recs&&o.recs.trim());
  const vals = state.values[o.id] ||= {};
  fields.forEach(f=>{ if(f.isDate && vals[f.key]==null){ vals[f.key]=new Date().toISOString().slice(0,10); } });
  const tags=(o.tags||[]).map(t=>`<span class="tag plain">${esc(t)}</span>`).join('');
  const fieldsHTML = fields.map((f,i)=>{
    const v=vals[f.key]; const id=`fld-${i}`;
    if(f.options){
      const sel = f.multi ? (Array.isArray(v)?v:[]) : v;
      const long = f.options.some(x=>x.length>28) || f.options.length>4;
      const gapOpts = f.options.some(hasGap);
      const gapOn = f.multi ? sel.some(hasGap) : hasGap(sel);
      return `<div class="f ${long?'wide':''}" data-k="${esc(f.key)}"><span class="lbl" id="${id}">${esc(f.label)}${f.multi?' <span class="multi">(varias)</span>':''}</span>
        <div class="opts" role="group" aria-labelledby="${id}">${f.options.map(op=>{ const on=f.multi?sel.includes(op):sel===op; return `<button type="button" class="opt" data-action="opt" data-k="${esc(f.key)}" data-v="${esc(op)}" aria-pressed="${on}">${esc(op)}</button>`; }).join('')}</div>
        ${gapOpts?`<input class="inp gapin" id="${id}-x" data-gap="${esc(f.key)}" placeholder="Completa el hueco «…»" value="${esc(vals[f.key+'::x']||'')}" autocomplete="off" ${gapOn?'':'hidden'}>`:''}</div>`;
    }
    return `<div class="f" data-k="${esc(f.key)}"><label for="${id}">${esc(f.label)}</label>
      <input class="inp" id="${id}" data-field="${esc(f.key)}" type="${f.isDate?'date':'text'}" value="${esc(v||'')}" autocomplete="off"></div>`;
  }).join('');
  const w=state.canWrite;
  setMain(`
    <button class="back" data-action="home">${ico('back')}Plantillas</button>
    <header class="doc-head t-${esc(o.type)}">
      <div class="eyebrow"><span class="tag">${esc(TYPES[o.type]?.label||'')}</span><span class="tag plain" title="${esc(SEC_NAMES[o.section]||'')}">${esc(o.section||'General')}</span>${tags}</div>
      <h1>${esc(o.title)}</h1>
      <div class="doc-actions">
        ${w?`<button class="btn fav" data-action="fav" aria-pressed="${!!o.fav}">${ico('star', o.fav?'filled':'')}${o.fav?'Favorita':'Marcar favorita'}</button>
        <button class="btn" data-action="edit">${ico('edit')}Editar</button>
        <button class="btn" data-action="dup">${ico('dup')}Duplicar</button>`:''}
      </div>
      <span class="updated">Actualizada ${esc(fmtDate(o.updatedAt))}${o.uses?` · copiada ${o.uses} ${o.uses===1?'vez':'veces'}`:''}</span>
    </header>
    ${fields.length||opts.length||ropts.length?`<section class="fields" aria-label="Rellenar campos">
      <div class="fields-head"><h2>Rellenar <small id="fcount"></small></h2><button class="btn ghost" data-action="clear">${ico('reset')}Limpiar</button></div>
      ${fields.length?`<div class="progress"><i id="fprog"></i></div>
      <div class="field-grid">${fieldsHTML}</div>`:''}
      ${optList(opts, 'Pasos opcionales', vals)}
      ${optList(ropts, 'Opcional en las recomendaciones', vals)}
      <p class="hint">Lo que escribas aquí no se guarda en ningún sitio y se pierde al recargar la página. No es necesario introducir datos identificativos del paciente.</p>
    </section>`:''}
    <section class="sheet t-${esc(o.type)}" aria-label="${esc(TYPES[o.type]?.band||'Informe')}">
      <div class="sheet-band"><b>${esc(TYPES[o.type]?.band||'')}</b><span>${esc(o.section||'General')} · SCGAD</span><button class="sheet-copy" data-action="copy" data-part="body">${ico('copy')}Copiar</button></div>
      <div class="sheet-body" id="preview"></div>
    </section>
    ${hasRecs?`<section class="sheet recs" aria-label="Recomendaciones al alta">
      <div class="sheet-band"><b>Recomendaciones al alta</b><span>Para el paciente</span><button class="sheet-copy" data-action="copy" data-part="recs">${ico('copy')}Copiar</button></div>
      <div class="sheet-body" id="preview-recs"></div>
    </section>`:''}

function insertAtCursor(text, selWord){

/* ---------- import / export ---------- */
function parseImport(text, defType, defSec){
  text=(text||'').trim(); if(!text) return [];
  if(/^[\[{]/.test(text)){
    try{
      let data=JSON.parse(text); if(!Array.isArray(data)) data=data.plantillas||data.templates||[data];
      return data.map(x=>({title:String(x.title||x.titulo||x.nombre||'').trim(), body:String(x.body||x.texto||x.contenido||''), recs:String(x.recs||x.recomendaciones||''), type:mapType(x.type||x.tipo)||defType, section:mapSection(x.section||x.seccion||x['sección'])||defSec, tags:Array.isArray(x.tags||x.etiquetas)?(x.tags||x.etiquetas).map(String):String(x.tags||x.etiquetas||'').split(',').map(s=>s.trim()).filter(Boolean), fav:!!x.fav})).filter(x=>x.title&&x.body.trim());
    }catch{ /* fall through to text */ }
  }
  const lines=text.replace(/\r/g,'').split('\n');
  const out=[]; let cur=null, inMeta=false;
  const push=()=>{ if(cur){ const sp=splitRecs(cur.body.join('\n').replace(/^\n+|\s+$/g,'')); cur.body=sp.body; cur.recs=sp.recs; if(cur.body||cur.recs) out.push(cur); } };
  for(const ln of lines){
    const h=ln.match(/^#\s+(.+)$/);
    if(h){ push(); cur={title:h[1].trim(),body:[],type:defType,section:defSec,tags:[]}; inMeta=true; continue; }
    if(!cur){ cur={title:ln.trim().slice(0,90)||'Plantilla importada',body:[],type:defType,section:defSec,tags:[]}; inMeta=true; continue; }
    if(inMeta){
      const mm=ln.match(/^\s*(tipo|secci[oó]n|etiquetas|tags)\s*:\s*(.*)$/i);
      if(mm){ const k=norm(mm[1]); if(k==='tipo') cur.type=mapType(mm[2])||cur.type; else if(k==='seccion') cur.section=mapSection(mm[2])||cur.section; else cur.tags=mm[2].split(',').map(s=>s.trim()).filter(Boolean); continue; }
      if(!ln.trim()) continue; inMeta=false;
    }
    cur.body.push(ln);
  }
  push();
  return out;
}

function exportJSON(){

function copyText(text, okMsg){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch{} ta.remove(); toast(ok?okMsg:'No se pudo copiar: selecciona el texto y cópialo a mano'); return ok; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>{ toast(okMsg); return true; }, ()=>fallback());
  }
  return Promise.resolve(fallback());
}

  switch(a){

    case 'new': if(state.canWrite) go('edit',null); break;
    case 'import': go('import'); break;
    case 'open': go('detail',b.dataset.id); break;
    case 'open-current': state.currentId?go('detail',state.currentId):go('list'); break;
    case 'type': state.type=b.dataset.v; renderList(); break;
    case 'sec': state.section=b.dataset.v; renderList(); break;
    case 'clear-filters': state.type='all'; state.section='all'; state.q=''; $('#q').value=''; renderList(); break;
    case 'edit': go('edit',state.currentId); break;
    case 'dup': {
      const o=state.items.get(state.currentId); if(!o) break;
      const c={...o,id:newId(),title:o.title+' (copia)',fav:false,uses:0,createdAt:nowISO(),updatedAt:nowISO()};
      try{ await saveItem(c); toast('Plantilla duplicada'); go('edit',c.id); }catch(e){ toast(dbErr(e)); }
      break; }
    case 'fav': {
      const o=state.items.get(state.currentId); if(!o) break;
      try{ await patchItem(o.id,{fav:!o.fav}); renderDetail(state.items.get(o.id)); renderList(); }catch(e){ toast(dbErr(e)); }
      break; }
    case 'opt': {
      const o=state.items.get(state.currentId); if(!o) break;
      const vals=state.values[o.id]||={}; const k=b.dataset.k, v=b.dataset.v;
      const f=parseFields(allText(o)).find(x=>x.key===k);
      if(f&&f.multi){ const arr=Array.isArray(vals[k])?[...vals[k]]:[]; const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); vals[k]=f.options.filter(x=>arr.includes(x)); }
      else vals[k]= vals[k]===v ? '' : v;
      b.parentElement.querySelectorAll('.opt').forEach(btn=>{ const on=Array.isArray(vals[k])?vals[k].includes(btn.dataset.v):vals[k]===btn.dataset.v; btn.setAttribute('aria-pressed',on); });
      const gi=b.closest('.f').querySelector('.gapin');
      if(gi){ const show=Array.isArray(vals[k])?vals[k].some(hasGap):hasGap(vals[k]); const was=gi.hidden; gi.hidden=!show; if(show && was) gi.focus(); }
      updatePreview(); break; }
    case 'optstep': toggleOpt(b.dataset.k); break;
    case 'clear': { const o=state.items.get(state.currentId); if(!o) break; state.values[o.id]={}; renderDetail(o); toast('Campos vaciados'); break; }
    case 'copy': {
      const o=state.items.get(state.currentId); if(!o) break;
      const fields=parseFields(allText(o)); const vals=state.values[o.id]||{};
      const part=b.dataset.part||'body';

      const ok=await copyText(txt, part==='recs'?'Recomendaciones copiadas':(o.recs?'Informe copiado':'Texto copiado'));
      if(ok && state.canWrite){ patchItem(o.id,{uses:(o.uses||0)+1,lastUsed:nowISO()}).then(()=>renderList()).catch(()=>{}); }

    case 'ins': insertAtCursor(b.dataset.v,b.dataset.sel); break;

      const id=state.currentId;

      break; }
    case 'do-import': doImport(); break;
    case 'export-copy': copyText(exportJSON(),'JSON copiado'); break;
    case 'restore-seed': {
      const seed=await fetchSeed(); let n=0;
      seed.forEach(o=>{ if(!state.items.has(o.id)){ state.items.set(o.id,{...o}); n++; } });
      if(n) persistLocal(); renderList(); renderStatus();

    case 'export-file': {

        a.href=URL.createObjectURL(blob); a.download=`plantillas-cgad-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500); toast('Copia descargada'); break;
      }

      catch(e){ if(e&&e.code!=='declined') toast('No se pudo descargar. Usa «Copiar JSON».'); }
      break; }
  }
});

}
function onData(){
  state.ready=true;
  renderList(); renderStatus();
  if(state.view==='detail'){
    const o=state.items.get(state.currentId);
    if(!o){ go('list'); return; }
    if(detailSig(o)!==state.sig) renderDetail(o);
  } else if(state.view==='list' || (state.view!=='edit' && state.view!=='import')){ renderMain(); }
}
async function fetchSeed(){
  try{ const r=await fetch('plantillas.json',{cache:'no-store'}); if(!r.ok) return [];
    const d=await r.json(); const arr=Array.isArray(d)?d:(d.plantillas||[]);
    return arr.filter(x=>x && x.id && x.title); }catch{ return []; }
}
async function startLocal(){
  state.mode='local'; loadLocal();
  if(!state.items.size){ const seed=await fetchSeed(); if(seed.length){ seed.forEach(o=>state.items.set(o.id,{...o})); persistLocal(); } }
  onData();
}
async function boot(){
  paintIcons(); document.body.dataset.view='list';
  try{ const s=localStorage.getItem('plantillario.sort'); if(s){ state.sort=s; $('#sort').value=s; } }catch{}
  renderChips(); renderWelcome();
  if(!window.claude || typeof window.claude.use!=='function'){ startLocal(); return; }
  const [dbNs, userNs, dl] = await Promise.all([
    window.claude.use('db').catch(()=>null),
    window.claude.use('user').catch(()=>null),
    window.claude.use('downloads').catch(()=>null)
  ]);
  downloads=dl;
  if(!dbNs){ startLocal(); return; }
  db=dbNs; state.mode='db';
  if(userNs){ try{ const can=await userNs.can('data.write'); if(can===false) state.canWrite=false; }catch{} }
  applyWriteMode();
  db.collection(COL).onSnapshot(snap=>{
    state.items=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
    onData();
  }, err=>{
    toast('Se perdió la conexión con la base de datos. Recarga la página.');
  });
}
boot();
</script>
</body>
</html>
