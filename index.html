<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Plantillario CGAD: plantillas de consulta, urgencias y protocolos quirúrgicos de Cirugía General y del Aparato Digestivo, listas para rellenar y copiar.">
<meta name="theme-color" content="#db2777">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plantillario CGAD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop workspace in three panes — template menu | fields | live text that will be copied. Phone: one pane at a time. */
:root{
  --bg:#f8f8fb; --surface:#ffffff; --sunk:#f4f4f5; --hover:#f1f1f4;
  --ink:#18181b; --ink2:#3f3f46; --muted:#71717a; --faint:#a1a1aa; --line:#e4e4e7; --line2:#d4d4d8;
  --accent:#db2777; --accent-hover:#be185d; --accent-ink:#ffffff; --accent-soft:#fdf2f8; --accent-line:#fbcfe8; --accent-text:#be185d;
  --urg:#ea580c; --qx:#0d9488; --cex:#4f46e5; --com:#8b5cf6; --danger:#dc2626;
  --fill-line:#f9a8d4;
  --shadow:0 1px 2px rgb(24 24 27 / .04), 0 2px 8px -2px rgb(24 24 27 / .06);
  --f:"Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --top:61px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0e; --surface:#141418; --sunk:#1c1c21; --hover:#202027;
  --ink:#fafafa; --ink2:#d4d4d8; --muted:#a1a1aa; --faint:#71717a; --line:#27272a; --line2:#3f3f46;
  --accent:#f472b6; --accent-hover:#f9a8d4; --accent-ink:#1a0610; --accent-soft:#2a1020; --accent-line:#5b2140; --accent-text:#f9a8d4;
  --urg:#fb923c; --qx:#2dd4bf; --cex:#818cf8; --com:#a78bfa; --danger:#f87171;
  --fill-line:#9d174d; --shadow:0 1px 2px rgb(0 0 0 / .5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0e; --surface:#141418; --sunk:#1c1c21; --hover:#202027;
  --ink:#fafafa; --ink2:#d4d4d8; --muted:#a1a1aa; --faint:#71717a; --line:#27272a; --line2:#3f3f46;
  --accent:#f472b6; --accent-hover:#f9a8d4; --accent-ink:#1a0610; --accent-soft:#2a1020; --accent-line:#5b2140; --accent-text:#f9a8d4;
  --urg:#fb923c; --qx:#2dd4bf; --cex:#818cf8; --com:#a78bfa; --danger:#f87171;
  --fill-line:#9d174d; --shadow:0 1px 2px rgb(0 0 0 / .5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.filled{fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
kbd{font-family:var(--f-mono);font-size:10.5px;line-height:1;padding:3px 5px;border-radius:5px;border:1px solid var(--line);color:var(--faint);background:var(--surface)}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.t-urgencias{--t:var(--urg)} .t-quirurgica{--t:var(--qx)} .t-consulta{--t:var(--cex)} .t-comun{--t:var(--com)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t,var(--faint));flex:none;display:inline-block}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:600;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.outline{background:transparent;border-color:var(--accent);color:var(--accent-text)}
.btn.outline:hover{background:var(--accent-soft)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px}
.btn.sm .ico{width:16px;height:16px}
.btn.danger{color:var(--danger)}
.btn.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn kbd{border-color:currentColor;color:inherit;opacity:.7;background:transparent}
.btn.fav[aria-pressed="true"]{color:var(--accent-text);border-color:var(--accent-line);background:var(--accent-soft)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{height:60px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0;color:var(--ink);flex:none}
.brand .mark{width:24px;height:24px;border-radius:8px;background:var(--accent);position:relative}
.brand .mark::before,.brand .mark::after{content:"";position:absolute;left:6px;right:6px;height:2.5px;border-radius:2px;background:var(--accent-ink)}
.brand .mark::before{top:8px}.brand .mark::after{top:13.5px;right:10px}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.brand-tag{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;height:40px;padding:0 14px;border-radius:999px;background:var(--sunk);border:1px solid transparent;transition:.15s}
.search:focus-within{background:var(--surface);border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.search .ico{color:var(--faint)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px}
.search input::placeholder{color:var(--faint)}
.top-actions{display:flex;gap:8px;flex:none}

/* app frame */
.app{display:grid;grid-template-columns:296px minmax(0,1fr);height:calc(100dvh - var(--top) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.side{border-right:1px solid var(--line);overflow:auto;background:var(--bg)}
.side-in{padding:18px 12px 24px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.main{min-width:0;overflow:hidden;background:var(--surface)}
.side-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:0 10px}
.typenav{display:flex;flex-direction:column;gap:2px}
.navrow{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border-radius:10px;border:0;background:none;color:var(--ink2);font-weight:500;font-size:13.5px;text-align:left}
.navrow:hover{background:var(--hover)}
.navrow[aria-current="true"]{background:var(--accent-soft);color:var(--accent-text);font-weight:700}
.navrow .ico{width:16px;height:16px;color:var(--faint)}
.navrow[aria-current="true"] .ico{color:var(--accent-text)}
.navrow .n{margin-left:auto;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;font-weight:500}
.navrow[aria-current="true"] .n{color:var(--accent-text)}
.pills{display:flex;flex-wrap:wrap;gap:6px;padding:0 6px}
.pill{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.pill:hover{border-color:var(--line2);color:var(--ink2)}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-text)}
.side-block{display:flex;flex-direction:column;gap:8px}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:6px}
.side-head select{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.items{display:flex;flex-direction:column;gap:1px;margin-top:-10px}
.group-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:14px 10px 4px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid transparent;background:none}
.item:hover{background:var(--hover)}
.item[aria-current="true"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
.item[aria-current="true"] .item-title{color:var(--accent-text)}
.item-meta{font-size:11.5px;color:var(--muted)}
.item .favmark{color:var(--accent);display:flex}
.item .favmark .ico{width:14px;height:14px}
.status{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--faint);padding:6px 10px 0}
.status i{width:6px;height:6px;border-radius:50%;background:var(--qx)}
.status.local i{background:var(--urg)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:20px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;font-size:13px;margin-top:10px}
.empty b{color:var(--ink);font-size:14px}
.skeleton{height:44px;border-radius:10px;margin:3px 0;background:linear-gradient(90deg,var(--sunk),var(--hover),var(--sunk));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}

/* workspace: fields | live preview */
.work{display:grid;grid-template-columns:minmax(340px,1fr) minmax(380px,1.08fr);height:100%}
.form-pane{overflow:auto;padding:28px 36px 56px}
.preview-pane > *{flex:none}
.preview-pane{overflow:auto;background:var(--bg);border-left:1px solid var(--line);padding:22px 28px 40px max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.back{display:none;align-items:center;gap:4px;border:0;background:none;font-weight:700;color:var(--accent-text);padding:4px 0;min-height:40px;margin-bottom:6px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);font-weight:500}
.crumbs .sep{color:var(--line2)}
.crumbs .tg{background:var(--sunk);border-radius:999px;padding:1px 8px;font-size:11.5px}
h1{font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.025em;margin:8px 0 0;color:var(--ink);text-wrap:balance}
h2{font-size:15px;font-weight:700;margin:0;color:var(--ink);letter-spacing:-.01em}
.form-head{display:flex;flex-direction:column;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.doc-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.sec-head small{font-size:12px;color:var(--muted);font-weight:500;margin-left:8px}
.form-sec{display:flex;flex-direction:column;gap:16px;margin-bottom:28px}
.field-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.field-grid .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f > label,.f > .lbl{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f .multi{font-weight:500;color:var(--faint)}
.f.is-active > label,.f.is-active > .lbl{color:var(--accent-text)}
.inp{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:14px;transition:border-color .15s, box-shadow .15s}
.inp:hover{border-color:var(--line2)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{height:auto;padding:12px}
select.inp{appearance:auto}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{min-height:34px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink2);text-align:left;line-height:1.3}
.wide .opt{border-radius:10px}
.opt:hover{border-color:var(--line2)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.optsteps{display:flex;flex-direction:column;gap:6px}
.optstep{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13px;line-height:1.4;color:var(--ink2)}
.optstep:hover{border-color:var(--line2)}
.optstep .ico{width:17px;height:17px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line2);stroke:transparent;padding:1px;background:var(--surface)}
.optstep[aria-pressed="true"]{border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink)}
.optstep[aria-pressed="true"] .ico{background:var(--accent);border-color:var(--accent);stroke:var(--accent-ink)}
.optstep span{min-width:0;overflow-wrap:anywhere}
.hint{margin:0;font-size:12px;color:var(--faint)}

/* preview */
.pv-head{display:flex;align-items:center;gap:10px;height:30px;flex-wrap:nowrap;overflow:hidden}
.pv-title,.pv-progress{white-space:nowrap}
@media (max-width:1299px){.bar-track{display:none}}
.pv-title{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.pv-progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-track{width:90px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.doc-head{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--line)}
.doc-head b{font-size:13px;font-weight:700;color:var(--ink)}
.doc-head .sp{flex:1}
.doc.recs{--t:var(--cex)}
.doc-text{padding:18px 20px 22px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.72;color:var(--ink2)}
.doc-text mark{background:none;color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--fill-line);cursor:text;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.doc-text mark.hole{background:var(--accent-soft);color:var(--accent-text);box-shadow:none;border-radius:5px;padding:1px 6px;font-size:.92em}
.doc-text mark.hl{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.doc-text .blank{color:var(--faint);font-style:italic}
.pv-note{font-size:12px;color:var(--faint);margin:0;padding:0 4px}
.pv-head .sp{flex:1}
.doc-actions .reset{margin-left:auto}
.doc-actions .reset.dirty{border-color:var(--accent);color:var(--accent-text);background:var(--accent-soft)}
.doc-text{outline:none;cursor:text;caret-color:var(--accent);transition:box-shadow .15s}
.doc:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}
.doc-text .opt-seg.off{display:none}
.doc-text mark[data-manual]{box-shadow:none;font-weight:inherit;color:inherit;background:none;padding:0}

/* pages: editor, import, welcome */
.page{height:100%;overflow:auto}
.page-in{max-width:880px;margin:0 auto;padding:32px max(32px,env(safe-area-inset-right,0px)) 64px max(32px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.page-in > h1{margin:0}
.form{display:flex;flex-direction:column;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.seg label{display:flex;align-items:center;justify-content:center;min-height:36px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;text-align:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked + label{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg input:focus-visible + label{outline:2px solid var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px}
textarea.body{min-height:42vh;font-family:var(--f-mono);font-size:12.5px;line-height:1.7;resize:vertical}
textarea.recs-ta{min-height:24vh}
.syntax{font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0;line-height:1.7}
.syntax code{font-family:var(--f-mono);font-size:11.5px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--ink)}
.detected{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent-text)}
.tag.plain{background:var(--sunk);color:var(--muted)}
.edbar{position:sticky;bottom:0;display:flex;gap:8px;align-items:center;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--surface) 30%)}
.edbar .sp{flex:1}
.err{color:var(--danger);font-size:12.5px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card p{margin:0;color:var(--muted);font-size:13px}
.imp-list{display:flex;flex-direction:column;gap:4px;max-height:260px;overflow:auto}
.imp-list div{display:flex;gap:8px;align-items:center;font-size:13px;padding:6px 8px;border-radius:8px;background:var(--bg)}
.imp-list div span{min-width:0;overflow-wrap:anywhere}
.filelabel{align-self:flex-start}
.filelabel input{position:absolute;opacity:0;width:1px;height:1px}
pre.sample{margin:0;font-family:var(--f-mono);font-size:11.5px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;line-height:1.6;color:var(--ink2)}
.notice{font-size:12px;color:var(--faint);margin:0}
.welcome{padding-top:6vh}
.welcome .lead{color:var(--muted);font-size:15px;max-width:58ch;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.stat span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-size:26px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick .btn{height:36px}

/* mobile copy bar + bottom nav */
.copybar{display:none}
.bottomnav{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:1199px){
  .app{grid-template-columns:256px minmax(0,1fr)}
  .form-pane{padding:24px 24px 48px}
  .preview-pane{padding:20px 20px 36px}
  .work{grid-template-columns:minmax(300px,1fr) minmax(320px,1fr)}
}
@media (max-width:899px){
  :root{--top:auto}
  .bar{height:auto;flex-wrap:wrap;gap:10px;padding-block:10px}
  .search{order:3;flex-basis:100%;max-width:none}
  body:not([data-view="list"]) .search{display:none}

<body>

  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ---------- constants ---------- */
const COL = 'plantillas';
const LS_KEY = 'plantillario.local.v1';
const TYPES = {
  urgencias:{label:'Urgencias', plural:'Urgencias', band:'Valoración de urgencias'},
  quirurgica:{label:'Quirúrgica', plural:'Quirúrgicas', band:'Hoja quirúrgica'},
  consulta:{label:'Consulta', plural:'Consulta', band:'Consulta externa'},
  comun:{label:'Campo común', plural:'Campos comunes', band:'Bloque reutilizable'}
};
const TYPE_ORDER = ['urgencias','quirurgica','consulta','comun'];
const SECTIONS = ['CCP','CEG','CHP','CEM','General'];
const SEC_NAMES = {CCP:'Colorrectal y Proctología',CEG:'Esofagogástrica, Bariátrica y Pared',CHP:'Hepatobiliopancreática',CEM:'Endocrina y Mama',General:'General / Urgencias'};
const I = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  star:'<path d="m12 3.6 2.6 5.3 5.8.9-4.2 4.1 1 5.8L12 17l-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  back:'<path d="M15 5l-7 7 7 7"/>',
  import:'<path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/>',
  dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6"/>',
  file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>'
};
const ico = (n, cls='') => `<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* ---------- state ---------- */
const state = {
  items:new Map(), ready:false, mode:'pending', canWrite:true,
  view:'list', currentId:null, q:'', type:'all', section:'all', sort:'recent',
  values:{}, docs:{}, sig:''
};
let db = null, downloads = null;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const newId = () => 'p-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowISO = () => new Date().toISOString();
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}); } catch { return ''; } };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2200); }
function mapType(v){ const n=norm(v); if(/^(urg|urgencia|urgencias)$/.test(n)) return 'urgencias'; if(/^(qx|quirurgica|quirurgico|quirofano|protocolo quirurgico|hoja quirurgica)$/.test(n)) return 'quirurgica'; if(/^(cex|consulta|consultas)$/.test(n)) return 'consulta'; if(/^(comun|campo comun|campos comunes|bloque|bloques)$/.test(n)) return 'comun'; return null; }
function mapSection(v){ const n=norm(v).toUpperCase(); const hit=SECTIONS.find(s=>s.toUpperCase()===n); return hit || (n ? 'General' : null); }

/* ---------- field parsing ---------- */
const TOKEN = /\{\{\s*([^{}:]+?)\s*(?::\s*([^{}]*?))?\s*\}\}/g;
const OPT = /\[\[([\s\S]*?)\]\]/g;
const GAP = /…|_{3,}/;
const hasGap = s => GAP.test(String(s||''));
function stripTokens(s){ return String(s).replace(TOKEN,(a,l)=>tokenLabel(l)).replace(/\s+/g,' ').replace(/^[-–•*]\s*/,'').trim(); }
function parseOptionals(body, prefix='opt:'){
  const out=[]; let m, i=0; OPT.lastIndex=0;
  while((m=OPT.exec(body||''))){ const l=stripTokens(m[1]); out.push({key:prefix+i, label:l.length>110?l.slice(0,108)+'…':l}); i++; }
  return out;
}
function parseFields(body){
  const out=[], seen=new Set(); let m; TOKEN.lastIndex=0;
  while((m=TOKEN.exec(body||''))){
    let label=m[1].trim(); let multi=false;
    if(label.endsWith('*')){ multi=true; label=label.slice(0,-1).trim(); }
    const key=norm(label); if(!key || seen.has(key)) continue; seen.add(key);
    const options = m[2] ? m[2].split('|').map(s=>s.trim()).filter(Boolean) : null;
    out.push({key,label,options:options&&options.length?options:null,multi,isDate:key==='fecha' || key.startsWith('fecha ')});
  }
  return out;
}
const RECS_HEAD = /^[ \t]*recomendaciones (?:al alta|terap[eé]uticas)[ \t]*:?[ \t]*$/im;
function splitRecs(text){
  const t=String(text||''); const m=t.match(RECS_HEAD);
  if(!m) return {body:t.replace(/\s+$/,''), recs:''};
  return {body:t.slice(0,m.index).replace(/\s+$/,''), recs:t.slice(m.index+m[0].length).replace(/^\s*\n/,'').replace(/\s+$/,'')};
}
const allText = o => (o.body||'') + '\n' + (o.recs||'');
function joinMulti(arr){ if(!arr||!arr.length) return ''; if(arr.length===1) return arr[0]; return arr.slice(0,-1).join(', ')+' y '+arr[arr.length-1]; }
function fillGap(f, s, vals){
  if(!f || !f.options || !hasGap(s)) return s;
  const x=vals && vals[f.key+'::x'];
  return s.replace(GAP, x && x.trim() ? x.trim() : '…');
}
function valueOf(f, vals){
  if(!f) return '';
  const v=vals ? vals[f.key] : null;
  if(v==null || v==='') return '';
  if(Array.isArray(v)) return joinMulti(v.map(x=>fillGap(f,x,vals)));
  if(f.isDate && /^\d{4}-\d{2}-\d{2}$/.test(v)){ const [y,mo,d]=v.split('-'); return `${d}/${mo}/${y}`; }
  return fillGap(f, String(v), vals);
}
function tokenLabel(raw){ let l=raw.trim(); if(l.endsWith('*')) l=l.slice(0,-1).trim(); return l; }
function fillText(body, vals, fields, prefix='opt:'){
  const fmap=Object.fromEntries(fields.map(f=>[f.key,f]));
  let i=0;
  let s=(body||'').replace(OPT,(a,inner)=>vals[prefix+(i++)] ? inner : '\u0000');
  s=s.replace(TOKEN,(all,lab)=>{ const l=tokenLabel(lab); const t=valueOf(fmap[norm(l)], vals); return t ? t : `[${l}]`; });
  s=s.split('\n').filter(line=>!/^[\s\u0000]*\u0000[\s\u0000]*$/.test(line)).join('\n').replace(/[ \t]*\u0000/g,'');
  return s.replace(/\n{3,}/g,'\n\n').replace(/^\n+|\s+$/g,'');
}
function tokensHTML(src, vals, fmap){
  let html='', last=0, m; TOKEN.lastIndex=0;
  while((m=TOKEN.exec(src))){
    html += esc(src.slice(last,m.index));
    const l=tokenLabel(m[1]), k=norm(l), t=valueOf(fmap[k], vals);
    html += t ? `<mark data-k="${esc(k)}" data-label="${esc(l)}" title="${esc(l)}">${esc(t)}</mark>` : `<mark class="hole" data-k="${esc(k)}" data-label="${esc(l)}">${esc(l)}</mark>`;
    last = TOKEN.lastIndex;
  }
  return html + esc(src.slice(last));
}
/* ---------- storage ---------- */
function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); const arr=raw?JSON.parse(raw):[]; state.items=new Map(arr.map(o=>[o.id,o])); }catch{ state.items=new Map(); } }
function persistLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify([...state.items.values()])); }catch{ toast('No se pudo guardar en este navegador'); } }
function bodyOf(o){ const {id, ...rest}=o; return rest; }
function dbErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){ state.canWrite=false; applyWriteMode(); return 'No tienes permiso para modificar estas plantillas.'; }
  if(c==='quota_exceeded') return 'Se ha llenado el espacio de la base de datos. Borra plantillas antiguas.';
  if(c==='resource_exhausted') return 'Demasiadas operaciones seguidas. Espera unos segundos.';
  return 'No se pudo guardar. Comprueba la conexión e inténtalo de nuevo.';
}
async function saveItem(o){
  if(state.mode==='db'){ await db.collection(COL).doc(o.id).set(bodyOf(o)); state.items.set(o.id,o); }
  else { state.items.set(o.id,o); persistLocal(); }
}
async function patchItem(id, patch){
  const cur=state.items.get(id); if(!cur) return;
  const next={...cur,...patch};
  if(state.mode==='db'){ await db.collection(COL).doc(id).update(patch); }
  else { persistLocal(); }
  state.items.set(id,next);
}
async function deleteItem(id){
  if(state.mode==='db'){ await db.collection(COL).doc(id).delete(); }
  state.items.delete(id); if(state.mode!=='db') persistLocal();
}

/* ---------- list ---------- */
const IS_MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
const KEY_COPY = IS_MAC ? '⌘↵' : 'Ctrl+↵';
const KEY_COPY_RECS = IS_MAC ? '⇧⌘↵' : 'Ctrl+⇧+↵';
const isDesktop = () => matchMedia('(min-width: 900px)').matches;

function filtered(){
  const q=norm(state.q);
  let arr=[...state.items.values()];
  if(state.type==='fav') arr=arr.filter(o=>o.fav);
  else if(state.type!=='all') arr=arr.filter(o=>o.type===state.type);
  if(state.section!=='all') arr=arr.filter(o=>o.section===state.section);
  if(q){ const words=q.split(/\s+/); arr=arr.filter(o=>{ const hay=norm([o.title,(o.tags||[]).join(' '),o.section,TYPES[o.type]?.label,o.body,o.recs].join(' ')); return words.every(w=>hay.includes(w)); }); }
  const by={
    recent:(a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')),
    used:(a,b)=>(b.uses||0)-(a.uses||0) || a.title.localeCompare(b.title,'es'),
    az:(a,b)=>a.title.localeCompare(b.title,'es')
  }[state.sort] || ((a,b)=>a.title.localeCompare(b.title,'es'));
  return arr.sort(by);
}
function renderChips(){
  const all=[...state.items.values()];
  const cnt=t=>t==='all'?all.length:t==='fav'?all.filter(o=>o.fav).length:all.filter(o=>o.type===t).length;
  const rows=[['all','Todas','',ico('list')],['urgencias','Urgencias','t-urgencias','<span class="dot"></span>'],['quirurgica','Quirúrgicas','t-quirurgica','<span class="dot"></span>'],['consulta','Consulta','t-consulta','<span class="dot"></span>'],['comun','Campos comunes','t-comun','<span class="dot"></span>'],['fav','Favoritas','',ico('star')]]
    .filter(([k])=>['all','urgencias','quirurgica','fav'].includes(k)||cnt(k)>0);
  $('#typeNav').innerHTML=rows.map(([k,l,c,i])=>`<button class="navrow ${c}" data-action="type" data-v="${k}" aria-current="${state.type===k}">${i}<span>${l}</span><span class="n">${cnt(k)}</span></button>`).join('');
  $('#secChips').innerHTML=[['all','Todas'],...SECTIONS.map(s=>[s,s])].map(([k,l])=>`<button class="pill" data-action="sec" data-v="${k}" aria-pressed="${state.section===k}" ${k!=='all'?`title="${esc(SEC_NAMES[k])}"`:''}>${esc(l)}</button>`).join('');
}
function itemHTML(o){
  const n=parseFields(allText(o)).length;
  return `<button class="item t-${esc(o.type)}" data-action="open" data-id="${esc(o.id)}" aria-current="${state.currentId===o.id && state.view==='detail'}">
    <span class="dot"></span>
    <span class="item-main"><span class="item-title">${esc(o.title)}</span>
    <span class="item-meta">${esc(o.section||'General')} · ${n} campo${n===1?'':'s'}${o.uses?` · ${o.uses}× usada`:''}</span></span>
    ${o.fav?`<span class="favmark" aria-label="Favorita">${ico('star','filled')}</span>`:''}
  </button>`;
}
function renderList(){
  renderChips();
  const box=$('#items');
  if(!state.ready){ return; }
  if(!state.items.size){
    box.innerHTML=`<div class="empty"><b>Aún no hay plantillas</b><span>Crea la primera o importa las que ya usas.</span>
      ${state.canWrite?`<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center"><button class="btn sm primary" data-action="new">${ico('plus')}Nueva</button><button class="btn sm" data-action="import">Importar</button></div>`:''}</div>`;
    return;
  }
  const arr=filtered();
  if(!arr.length){ box.innerHTML=`<div class="empty"><b>Sin resultados</b><span>Prueba con otra palabra o quita filtros.</span><button class="btn sm" data-action="clear-filters">Quitar filtros</button></div>`; return; }
  if(state.type==='all' && state.sort!=='used' && !state.q){
    const groups=TYPE_ORDER.map(t=>[t,arr.filter(o=>o.type===t)]).filter(g=>g[1].length);
    box.innerHTML=groups.map(([t,l])=>`<div class="group-label">${TYPES[t].plural}</div>`+l.map(itemHTML).join('')).join('');
  } else box.innerHTML=arr.map(itemHTML).join('');
}
function renderStatus(){
  const s=$('#status');
  if(!state.ready){ s.className='status'; s.innerHTML='<i></i>Cargando…'; return; }
  const n=state.items.size;
  if(state.mode==='db'){ s.className='status'; s.innerHTML=`<i></i>${n} plantilla${n===1?'':'s'} · sincronizadas`; }
  else { s.className='status local'; s.innerHTML=`<i></i>${n} plantilla${n===1?'':'s'} · guardadas en este navegador`; }
}

/* ---------- main views ---------- */
function setMain(html){ $('#main').innerHTML=`<div class="page"><div class="page-in">${html}</div></div>`; }
function go(view, id=null){
  state.view=view; state.currentId=id; state.hlKey=null;
  document.body.dataset.view=view;
  $('#navList').setAttribute('aria-current', view==='list');
  renderMain(); renderList();
  if(!isDesktop()) window.scrollTo({top:0});
}
function renderMain(){
  const v=state.view;
  $('#copybar').innerHTML='';
  if(v==='detail'){ const o=state.items.get(state.currentId); if(!o){ return renderWelcome(); } return renderDetail(o); }
  if(v==='edit') return renderEditor(state.currentId ? state.items.get(state.currentId) : null);
  if(v==='import') return renderImport();
  renderWelcome();
}
function renderWelcome(){
  const all=[...state.items.values()];
  const c=t=>all.filter(o=>o.type===t).length;
  const quick=[...all.filter(o=>o.fav), ...all.filter(o=>!o.fav && o.uses).sort((a,b)=>(b.uses||0)-(a.uses||0))].slice(0,8);
  setMain(`<div class="welcome" style="display:flex;flex-direction:column;gap:22px">
    <h1>Elige una plantilla para empezar</h1>
    <p class="lead">Selecciona una plantilla en el menú de la izquierda. Rellena los campos y, a la derecha, verás el texto exacto que se copiará a la historia clínica.</p>
    <div class="stats">
      <div class="stat t-urgencias"><span><i class="dot"></i>Urgencias</span><b>${c('urgencias')}</b></div>
      <div class="stat t-quirurgica"><span><i class="dot"></i>Quirúrgicas</span><b>${c('quirurgica')}</b></div>
      <div class="stat t-consulta"><span><i class="dot"></i>Consulta</span><b>${c('consulta')}</b></div>
      <div class="stat t-comun"><span><i class="dot"></i>Campos comunes</span><b>${c('comun')}</b></div>
    </div>
    ${quick.length?`<div style="display:flex;flex-direction:column;gap:10px"><div class="side-label" style="padding:0">Acceso rápido</div><div class="quick">${quick.map(o=>`<button class="btn sm t-${esc(o.type)}" data-action="open" data-id="${esc(o.id)}"><span class="dot"></span>${esc(o.title)}</button>`).join('')}</div></div>`:''}
    ${syntaxHelp()}
    <p class="notice">Atajos: <kbd>/</kbd> buscar · <kbd>${KEY_COPY}</kbd> copiar informe · <kbd>${KEY_COPY_RECS}</kbd> copiar recomendaciones.</p>
  </div>`);
}
function syntaxHelp(){
  return `<p class="syntax"><b>Cómo se escriben los campos.</b> <code>{{Edad}}</code> hueco de texto · <code>{{Lado: derecha | izquierda}}</code> opciones · <code>{{Hallazgos*: a | b | c}}</code> varias opciones · <code>{{Fiebre: Afebril | Fiebre de … ºC}}</code> la opción con «…» abre un hueco · <code>{{Fecha}}</code> calendario · <code>[[- Drenaje de Penrose…]]</code> paso opcional, solo se copia si se marca. Un mismo nombre de campo se rellena una sola vez.</p>`;
}
function detailSig(o){ return [o.id,o.title,o.type,o.section,(o.tags||[]).join(','),o.body,o.recs,o.fav,o.updatedAt].join('|'); }
function fieldHTML(f, i, vals){
  const v=vals[f.key]; const id=`fld-${i}`;
  if(f.options){
    const sel = f.multi ? (Array.isArray(v)?v:[]) : v;
    const long = f.options.some(x=>x.length>26) || f.options.length>4;
    const gapOpts = f.options.some(hasGap);
    const gapOn = f.multi ? sel.some(hasGap) : hasGap(sel);

/* The preview is a live, editable document. It is built once per template and then
   refreshed in place: marks update when fields change, optional steps show or hide,
   and anything typed by hand stays put until the template is reset. */
function docHTML(src, vals, fmap, prefix){
  src=String(src||'').replace(/\s+$/,'');
  let html='', last=0, m, i=0; OPT.lastIndex=0;
  while((m=OPT.exec(src))){
    let start=m.index, end=m.index+m[0].length, pre='', post='';
    const lineStart = start===0 || src[start-1]==='\n';
    const lineEnd = end===src.length || src[end]==='\n';
    if(lineStart && lineEnd && end<src.length){ post='\n'; end+=1; }
    else if(!lineStart && src[start-1]===' '){ start-=1; pre=' '; }
    html += tokensHTML(src.slice(last,start), vals, fmap);
    const k=prefix+(i++);
    html += `<span class="opt-seg${vals[k]?'':' off'}" data-opt="${k}">${esc(pre)}${tokensHTML(m[1], vals, fmap)}${esc(post)}</span>`;
    last=end; OPT.lastIndex=m.index+m[0].length;
  }
  return html + tokensHTML(src.slice(last), vals, fmap);
}

function makeEditable(el){

function updatePreview(){

    else { const l=mk.dataset.label||''; if(mk.textContent!==l) mk.textContent=l; mk.classList.add('hole'); }
  });

  const done=fields.filter(f=>valueOf(f,vals)).length;

function serializeDoc(el){
  if(!el) return '';
  let out='';
  (function walk(n){
    if(n.nodeType===3){ out+=n.nodeValue; return; }
    if(n.nodeType!==1) return;
    if(n.classList.contains('off')) return;
    if(n.tagName==='BR'){ out+='\n'; return; }
    if(n.tagName==='MARK' && n.classList.contains('hole') && !n.dataset.manual){ out+='['+(n.dataset.label||n.textContent)+']'; return; }
    const block = n!==el && /^(DIV|P)$/.test(n.tagName);
    if(block && out && !out.endsWith('\n')) out+='\n';
    n.childNodes.forEach(walk);
  })(el);
  return out.replace(/ /g,' ').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\s+$/g,'');
}

}

/* ---------- import / export ---------- */
function parseImport(text, defType, defSec){
  text=(text||'').trim(); if(!text) return [];
  if(/^[\[{]/.test(text)){
    try{
      let data=JSON.parse(text); if(!Array.isArray(data)) data=data.plantillas||data.templates||[data];
      return data.map(x=>({title:String(x.title||x.titulo||x.nombre||'').trim(), body:String(x.body||x.texto||x.contenido||''), recs:String(x.recs||x.recomendaciones||''), type:mapType(x.type||x.tipo)||defType, section:mapSection(x.section||x.seccion||x['sección'])||defSec, tags:Array.isArray(x.tags||x.etiquetas)?(x.tags||x.etiquetas).map(String):String(x.tags||x.etiquetas||'').split(',').map(s=>s.trim()).filter(Boolean), fav:!!x.fav})).filter(x=>x.title&&x.body.trim());
    }catch{ /* fall through to text */ }
  }
  const lines=text.replace(/\r/g,'').split('\n');
  const out=[]; let cur=null, inMeta=false;
  const push=()=>{ if(cur){ const sp=splitRecs(cur.body.join('\n').replace(/^\n+|\s+$/g,'')); cur.body=sp.body; cur.recs=sp.recs; if(cur.body||cur.recs) out.push(cur); } };
  for(const ln of lines){
    const h=ln.match(/^#\s+(.+)$/);
    if(h){ push(); cur={title:h[1].trim(),body:[],type:defType,section:defSec,tags:[]}; inMeta=true; continue; }
    if(!cur){ cur={title:ln.trim().slice(0,90)||'Plantilla importada',body:[],type:defType,section:defSec,tags:[]}; inMeta=true; continue; }
    if(inMeta){
      const mm=ln.match(/^\s*(tipo|secci[oó]n|etiquetas|tags)\s*:\s*(.*)$/i);
      if(mm){ const k=norm(mm[1]); if(k==='tipo') cur.type=mapType(mm[2])||cur.type; else if(k==='seccion') cur.section=mapSection(mm[2])||cur.section; else cur.tags=mm[2].split(',').map(s=>s.trim()).filter(Boolean); continue; }
      if(!ln.trim()) continue; inMeta=false;
    }
    cur.body.push(ln);
  }
  push();
  return out;
}

  const box=$('#imp-preview'), go=$('#imp-go');
  go.disabled=!list.length;
  go.innerHTML=`${ico('import')}Importar ${list.length||''} plantilla${list.length===1?'':'s'}`;
  box.innerHTML=list.length?`<div class="imp-list">${list.map(x=>`<div class="t-${x.type}"><span class="tag">${esc(TYPES[x.type].label)}</span><span class="tag plain">${esc(x.section)}</span><span>${esc(x.title)} · ${parseFields(allText(x)).length} campos${(x.recs||splitRecs(x.body).recs)?' · con recomendaciones':''}</span></div>`).join('')}</div>`:(t.value.trim()?'<p class="hint">No se ha detectado ninguna plantilla. Revisa que cada una empiece por «# Título».</p>':'');
}
async function doImport(){
  const list=parseImport($('#imp-text').value,$('#imp-type').value,$('#imp-sec').value);
  if(!list.length) return;
  const btn=$('#imp-go'); btn.disabled=true;
  let ok=0;
  for(const x of list){
    const sp=x.recs?{body:x.body,recs:x.recs}:splitRecs(x.body);
    const o={id:newId(),title:x.title,type:x.type,section:x.section,tags:x.tags,body:sp.body,recs:sp.recs,fav:!!x.fav,uses:0,createdAt:nowISO(),updatedAt:nowISO()};
    try{ await saveItem(o); ok++; btn.textContent=`Importando ${ok}/${list.length}…`; }
    catch(e){ toast(dbErr(e)); break; }
  }
  renderList(); renderStatus();
  if(ok){ toast(`${ok} plantilla${ok===1?'':'s'} importada${ok===1?'':'s'}`); go('list'); }
  else btn.disabled=false;
}
function exportJSON(){
  const arr=[...state.items.values()].sort((a,b)=>a.title.localeCompare(b.title,'es')).map(({id,uses,...r})=>r);
  return JSON.stringify({app:'Plantillario CGAD',exportado:nowISO(),plantillas:arr},null,2);
}
function copyText(text, okMsg){
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch{} ta.remove(); toast(ok?okMsg:'No se pudo copiar: selecciona el texto y cópialo a mano'); return ok; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>{ toast(okMsg); return true; }, ()=>fallback());
  }
  return Promise.resolve(fallback());
}

/* ---------- write mode ---------- */
function applyWriteMode(){
  const show=state.canWrite;
  $('#btnNew').hidden=!show; $('#navNew').hidden=!show;
}

/* ---------- events ---------- */
document.addEventListener('click', async ev=>{
  const b=ev.target.closest('[data-action]');
  const mk=ev.target.closest('.doc-text mark');
  if(mk && !b){
    const f=document.querySelector(`.f[data-k="${CSS.escape(mk.dataset.k)}"]`);
    if(f && isDesktop()) f.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
    highlight(mk.dataset.k,false);
    return;
  }
  if(!b) return;
  const a=b.dataset.action;
  if(a!=='del'){ const armed=document.querySelector('.btn.armed'); if(armed){ armed.classList.remove('armed'); armed.innerHTML=`${ico('trash')}Borrar`; } }
  switch(a){
    case 'home': go('list'); break;
    case 'new': if(state.canWrite) go('edit',null); break;
    case 'import': go('import'); break;
    case 'open': go('detail',b.dataset.id); break;
    case 'open-current': state.currentId?go('detail',state.currentId):go('list'); break;
    case 'type': state.type=b.dataset.v; renderList(); break;
    case 'sec': state.section=b.dataset.v; renderList(); break;
    case 'clear-filters': state.type='all'; state.section='all'; state.q=''; $('#q').value=''; renderList(); break;
    case 'edit': go('edit',state.currentId); break;
    case 'dup': {
      const o=state.items.get(state.currentId); if(!o) break;
      const c={...o,id:newId(),title:o.title+' (copia)',fav:false,uses:0,createdAt:nowISO(),updatedAt:nowISO()};
      try{ await saveItem(c); toast('Plantilla duplicada'); go('edit',c.id); }catch(e){ toast(dbErr(e)); }
      break; }
    case 'fav': {
      const o=state.items.get(state.currentId); if(!o) break;
      try{ await patchItem(o.id,{fav:!o.fav}); renderDetail(state.items.get(o.id)); renderList(); }catch(e){ toast(dbErr(e)); }
      break; }
    case 'opt': {
      const o=state.items.get(state.currentId); if(!o) break;
      const vals=state.values[o.id]||={}; const k=b.dataset.k, v=b.dataset.v;
      const f=parseFields(allText(o)).find(x=>x.key===k);
      if(f&&f.multi){ const arr=Array.isArray(vals[k])?[...vals[k]]:[]; const i=arr.indexOf(v); i>=0?arr.splice(i,1):arr.push(v); vals[k]=f.options.filter(x=>arr.includes(x)); }
      else vals[k]= vals[k]===v ? '' : v;
      b.parentElement.querySelectorAll('.opt').forEach(btn=>{ const on=Array.isArray(vals[k])?vals[k].includes(btn.dataset.v):vals[k]===btn.dataset.v; btn.setAttribute('aria-pressed',on); });
      const gi=b.closest('.f').querySelector('.gapin');
      if(gi){ const show=Array.isArray(vals[k])?vals[k].some(hasGap):hasGap(vals[k]); const was=gi.hidden; gi.hidden=!show; if(show && was) gi.focus(); }
      state.hlKey=k; updatePreview(); highlight(k); break; }
    case 'optstep': toggleOpt(b.dataset.k); break;
    case 'reset': case 'clear': { const o=state.items.get(state.currentId); if(!o) break; state.values[o.id]={}; delete state.docs[o.id]; state.hlKey=null; renderDetail(o); $('#formPane') && ($('#formPane').scrollTop=0); $('#previewPane') && ($('#previewPane').scrollTop=0); toast('Plantilla reiniciada'); break; }
    case 'copy': copyPart(b.dataset.part||'body'); break;
    case 'ins': insertAtCursor(b.dataset.v,b.dataset.sel); break;
    case 'del': {
      if(!b.classList.contains('armed')){ b.classList.add('armed'); b.innerHTML=`${ico('trash')}Pulsa otra vez para borrar`; break; }
      const id=state.currentId;
      try{ await deleteItem(id); delete state.values[id]; toast('Plantilla borrada'); go('list'); }catch(e){ toast(dbErr(e)); }
      break; }
    case 'do-import': doImport(); break;
    case 'export-copy': copyText(exportJSON(),'JSON copiado'); break;
    case 'restore-seed': {
      const seed=await fetchSeed(); let n=0;
      seed.forEach(o=>{ if(!state.items.has(o.id)){ state.items.set(o.id,{...o}); n++; } });
      if(n) persistLocal(); renderList(); renderStatus();
      toast(seed.length ? (n?`${n} plantilla${n===1?'':'s'} restaurada${n===1?'':'s'}`:'No faltaba ninguna plantilla') : 'No se encontraron las plantillas iniciales');
      break; }
    case 'export-file': {
      if(!downloads && !window.claude){
        const blob=new Blob([exportJSON()],{type:'application/json'}); const el=document.createElement('a');
        el.href=URL.createObjectURL(blob); el.download=`plantillas-cgad-${new Date().toISOString().slice(0,10)}.json`;
        document.body.appendChild(el); el.click(); setTimeout(()=>{ URL.revokeObjectURL(el.href); el.remove(); },500); toast('Copia descargada'); break;
      }
      if(!downloads) break;
      try{ await downloads.save({filename:`plantillas-cgad-${new Date().toISOString().slice(0,10)}.json`,data:exportJSON()}); toast('Copia descargada'); }
      catch(e){ if(e&&e.code!=='declined') toast('No se pudo descargar. Usa «Copiar JSON».'); }
      break; }
  }
});
document.addEventListener('input', ev=>{
  const t=ev.target;
  if(t.classList && t.classList.contains('doc-text')){
    const o=state.items.get(state.currentId); if(!o) return;
    const sel=window.getSelection(); const n=sel && sel.anchorNode;
    const mk=n && (n.nodeType===1?n:n.parentElement)?.closest('mark');
    if(mk && t.contains(mk)){ mk.dataset.manual='1'; mk.classList.remove('hole'); }
    t.querySelectorAll('mark:not([data-manual])').forEach(m=>{ if(m.textContent==='' ) m.dataset.manual='1'; });
    saveDocs(o); return;
  }
  if(t.id==='q'){ state.q=t.value; renderList(); return; }
  if(t.dataset && t.dataset.field){ const o=state.items.get(state.currentId); if(!o) return; (state.values[o.id]||={})[t.dataset.field]=t.value; updatePreview(); return; }
  if(t.dataset && t.dataset.gap){ const o=state.items.get(state.currentId); if(!o) return; (state.values[o.id]||={})[t.dataset.gap+'::x']=t.value; updatePreview(); return; }
  if(t.id==='ed-body'||t.id==='ed-recs'){ updateDetected(); $('#edErr').textContent=''; return; }
  if(t.id==='ed-title'){ $('#edErr').textContent=''; return; }
  if(t.id==='imp-text') updateImportPreview();
});
document.addEventListener('change', ev=>{
  const t=ev.target;
  if(t.id==='sort'){ state.sort=t.value; try{ localStorage.setItem('plantillario.sort',t.value); }catch{} renderList(); }
  if(t.id==='imp-type'||t.id==='imp-sec') updateImportPreview();
  if(t.id==='imp-file' && t.files && t.files[0]){ const r=new FileReader(); r.onload=()=>{ $('#imp-text').value=String(r.result||''); updateImportPreview(); }; r.readAsText(t.files[0]); }
});
document.addEventListener('focusin', ev=>{
  const t=ev.target;
  if(t.matches && t.matches('textarea[data-ed]')) lastEd=t.id;
  const f=t.closest && t.closest('#formPane .f[data-k]');
  if(f) highlight(f.dataset.k);
});
document.addEventListener('paste', ev=>{
  const t=ev.target.closest && ev.target.closest('.doc-text');
  if(!t || PLAINTEXT_OK) return;
  ev.preventDefault(); const text=(ev.clipboardData||window.clipboardData).getData('text/plain');
  document.execCommand('insertText', false, text);
});
document.addEventListener('submit', ev=>{ if(ev.target.id==='edForm') submitEditor(ev); });
function toggleOpt(k){
  const o=state.items.get(state.currentId); if(!o || !k) return;
  const vals=state.values[o.id]||={}; vals[k]=!vals[k];
  const btn=document.querySelector(`.optstep[data-k="${CSS.escape(k)}"]`); if(btn) btn.setAttribute('aria-pressed',!!vals[k]);
  updatePreview();
}
document.addEventListener('keydown', ev=>{
  const mod = ev.metaKey || ev.ctrlKey;
  if(mod && ev.key==='Enter' && state.view==='detail'){ ev.preventDefault(); copyPart(ev.shiftKey?'recs':'body'); return; }
  if(ev.key==='Escape' && document.activeElement && document.activeElement.id==='q'){ document.activeElement.blur(); return; }
  if(ev.key==='/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ ev.preventDefault(); if(state.view!=='list' && !isDesktop()) go('list'); $('#q').focus(); }
});

/* ---------- boot ---------- */
function paintIcons(){
  $('#searchIco').innerHTML=ico('search');
  $('#navListIco').innerHTML=ico('list'); $('#navNewIco').innerHTML=ico('plus'); $('#navImpIco').innerHTML=ico('import');
  $('#btnNew').innerHTML=`${ico('plus')}Nueva plantilla`;
}
function onData(){
  state.ready=true;
  renderList(); renderStatus();
  if(state.view==='detail'){
    const o=state.items.get(state.currentId);
    if(!o){ go('list'); return; }
    if(detailSig(o)!==state.sig) renderDetail(o);
  } else if(state.view==='list'){ renderMain(); }
}
const SEED_KEY='plantillario.seed';
async function fetchSeedData(){
  try{ const r=await fetch('plantillas.json',{cache:'no-store'}); if(!r.ok) return null;
    const d=await r.json(); const arr=(Array.isArray(d)?d:(d.plantillas||[])).filter(x=>x && x.id && x.title);
    return {version:Number(d.version)||1, items:arr}; }catch{ return null; }
}
async function fetchSeed(){ const d=await fetchSeedData(); return d?d.items:[]; }
async function startLocal(){
  state.mode='local'; loadLocal();
  const seed=await fetchSeedData();
  if(seed && seed.items.length){
    let meta={}; try{ meta=JSON.parse(localStorage.getItem(SEED_KEY)||'{}')||{}; }catch{}
    if(!state.items.size){ seed.items.forEach(o=>state.items.set(o.id,{...o})); persistLocal(); }
    else if((meta.version||1) < seed.version){
      /* refresh the starter templates the viewer has not edited since they were loaded */
      let n=0;
      seed.items.forEach(sd=>{
        const l=state.items.get(sd.id); if(!l) return;
        const known=meta.stamps ? meta.stamps[sd.id] : null;
        const untouched = known ? l.updatedAt===known : String(l.updatedAt||'') <= '2026-10-18T17:00:00Z';
        if(untouched && l.updatedAt!==sd.updatedAt){ state.items.set(sd.id,{...sd, fav:!!l.fav, uses:l.uses||0}); n++; }
      });
      if(n){ persistLocal(); setTimeout(()=>toast(`${n} plantilla${n===1?'':'s'} actualizada${n===1?'':'s'}`),600); }
    }
    try{ localStorage.setItem(SEED_KEY, JSON.stringify({version:seed.version, stamps:Object.fromEntries(seed.items.map(x=>[x.id,x.updatedAt]))})); }catch{}
  }
  onData();
}
async function boot(){
  paintIcons(); document.body.dataset.view='list';
  state.sort='az';
  try{ const s=localStorage.getItem('plantillario.sort'); if(s && ['az','used','recent'].includes(s)) state.sort=s; }catch{}
  $('#sort').value=state.sort;
  renderChips(); renderWelcome();
  if(!window.claude || typeof window.claude.use!=='function'){ startLocal(); return; }
  const [dbNs, userNs, dl] = await Promise.all([
    window.claude.use('db').catch(()=>null),
    window.claude.use('user').catch(()=>null),
    window.claude.use('downloads').catch(()=>null)
  ]);
  downloads=dl;
  if(!dbNs){ startLocal(); return; }
  db=dbNs; state.mode='db';
  if(userNs){ try{ const can=await userNs.can('data.write'); if(can===false) state.canWrite=false; }catch{} }
  applyWriteMode();
  db.collection(COL).onSnapshot(snap=>{
    state.items=new Map(snap.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
    onData();
  }, err=>{
    toast('Se perdió la conexión con la base de datos. Recarga la página.');
  });
}
boot();
</script>
